name: Getrak — Sync rastreador frota

on:
  # Disparo primário a cada 20 min vem de cron externo (cron-job.org) via API
  # workflow_dispatch — mais confiável que o schedule do GitHub. O schedule interno
  # */20 foi removido porque atrasava e colidia com o dispatch externo no mesmo
  # concurrency group (cancel-in-progress), gerando runs "startup_failure" sem parar
  # o sync real. Mantido abaixo só como REDE DE SEGURANÇA 1x/hora (se o cron externo
  # cair). Minuto :30 fica no meio do intervalo do cron externo (:00/:20/:40) p/
  # minimizar colisão; se colidir mesmo assim, o pior caso é um run cancelado (sync
  # é idempotente).
  schedule:
    - cron: '30 * * * *' # fallback: 1x por hora
  workflow_dispatch: # cron externo + execução manual pelo GitHub UI

# Um sync por vez: se o app do Getrak travar e o run anterior ainda estiver rodando,
# cancela o antigo em vez de empilhar (o scrape é idempotente, sempre pega o estado atual).
concurrency:
  group: getrak-rastreador
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + system dependencies
        run: npx playwright install chromium --with-deps

      - name: Run sync
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          GETRAK_USER: ${{ secrets.GETRAK_USER }}
          GETRAK_PASS: ${{ secrets.GETRAK_PASS }}
        run: node sync-rastreador-getrak.js
