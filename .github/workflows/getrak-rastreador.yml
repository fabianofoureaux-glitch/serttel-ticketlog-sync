name: Getrak — Sync rastreador frota

on:
  schedule:
    - cron: '0 * * * *' # de hora em hora (UTC; sync é idempotente, fuso não importa)
  workflow_dispatch: # permite rodar manualmente pelo GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + system dependencies
        run: npx playwright install chromium --with-deps

      - name: Run sync
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          GETRAK_USER: ${{ secrets.GETRAK_USER }}
          GETRAK_PASS: ${{ secrets.GETRAK_PASS }}
        run: node sync-rastreador-getrak.js
