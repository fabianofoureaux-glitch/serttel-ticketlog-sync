name: Getrak — Sync rastreador frota

on:
  schedule:
    - cron: '*/20 * * * *' # a cada 20 min (UTC; sync é idempotente, fuso não importa)
  workflow_dispatch: # permite rodar manualmente pelo GitHub UI

# Um sync por vez: se o app do Getrak travar e o run anterior ainda estiver rodando,
# cancela o antigo em vez de empilhar (o scrape é idempotente, sempre pega o estado atual).
concurrency:
  group: getrak-rastreador
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + system dependencies
        run: npx playwright install chromium --with-deps

      - name: Run sync
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          GETRAK_USER: ${{ secrets.GETRAK_USER }}
          GETRAK_PASS: ${{ secrets.GETRAK_PASS }}
        run: node sync-rastreador-getrak.js
